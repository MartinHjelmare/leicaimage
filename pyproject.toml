[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "leicaimage"
version = "0.6.0"
description = "Handle Leica Matrix Screener experiment images."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Martin Hjelmare", email = "marhje52@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
]
urls."Bug Tracker" = "https://github.com/MartinHjelmare/leicaimage/issues"
urls.Changelog = "https://github.com/MartinHjelmare/leicaimage/blob/main/CHANGELOG.md"
urls.repository = "https://github.com/MartinHjelmare/leicaimage"

[dependency-groups]
dev = [
  "codespell==2.4.3",
  "copier==9.17.2",
  "prek==0.5.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "python-semantic-release==10.6.2",
  "ruff==0.16.5",
  "sybil==10.1.0",
  "ty==0.0.75",
]

[tool.ruff]
line-length = 88
lint.select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # flake8-docstrings
  "E",   # pycodestyle
  "F",   # pyflake
  "I",   # isort
  "RUF", # ruff specific
  "S",   # flake8-bandit
  "UP",  # pyupgrade
  "W",   # pycodestyle
]
lint.ignore = [
  "D203", # 1 blank line required before class docstring
  "D213", # Multi-line docstring summary should start at the second line
]
lint.per-file-ignores."tests/**/*" = [
  "S101",
]
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [ "leicaimage", "tests" ]

[tool.pyproject-fmt]
keep_full_version = true
max_supported_python = "3.15"

[tool.ty]
terminal.error-on-warning = true

[tool.pytest]
addopts = [
  "-Wonce",
  "-p no:doctest",
  "--cov=leicaimage",
  "--cov-report=term",
  "--cov-report=xml",
]
minversion = "9.0"
pythonpath = [ "src" ]

[tool.coverage]
run.branch = true
paths.source = [
  "src",
  ".tox/**/site-packages",
]
report.exclude_lines = [
  "@overload",
  "def __repr__",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.semantic_release]
tag_format = "{version}"
major_on_zero = false
allow_zero_version = true
version_variables = [
  "src/leicaimage/__init__.py:__version__",
]
version_toml = [ "pyproject.toml:project.version" ]
build_command = """
pip install uv
uv lock
git add uv.lock
uv build
"""
commit_parser_options.parse_squash_commits = false
branches.main.match = "main"
branches.noop.match = "(?!main$)"
branches.noop.prerelease = true
changelog.environment.keep_trailing_newline = true
changelog.exclude_commit_patterns = [
  "chore(?:\\([^)]*?\\))?: .+",
  "ci(?:\\([^)]*?\\))?: .+",
  "refactor(?:\\([^)]*?\\))?: .+",
  "style(?:\\([^)]*?\\))?: .+",
  "test(?:\\([^)]*?\\))?: .+",
  "build\\((?!deps\\): .+)",
  "Merged? .*",
  "Initial [Cc]ommit.*",         # codespell:ignore
]
